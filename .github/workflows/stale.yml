name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'

# actions/stale needs to label and close issues and pull requests, and nothing
# else. Declaring that explicitly keeps a scheduled job -- which always runs with
# base-branch privileges -- from holding write access to repository contents.
permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has no activity in a while - it will be closed soon.'
          exempt-issue-labels: enhancement
          stale-pr-message: 'This PR has no activity in a while - it will be closed soon.'
          days-before-stale: 42
          days-before-close: 7
