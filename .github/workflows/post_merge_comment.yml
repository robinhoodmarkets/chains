on:
  pull_request_target:
    types: [closed]

# Same reasoning as pr_intro_comment.yml: a `pull_request_target` job runs with
# base-repository privileges, and this one only needs to leave a comment.
permissions:
  pull-requests: write

jobs:
  comment_on_merged_pr:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    name: Comment after PR merge
    steps:
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            PR merged - please consider contributing some funds to lists.eth
